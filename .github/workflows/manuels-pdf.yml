# Regenere les manuels PDF (format A4) a chaque commit qui modifie la documentation,
# et les publie dans la release "manuels" (toujours la derniere version, sans commit).
name: Manuels PDF

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - outils/manuels_pdf.py
      - .github/workflows/manuels-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuels-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer les polices des captures
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core

      - name: Generer les PDF
        run: |
          python3 outils/manuels_pdf.py README.md impression/Manuel_Minitel_Magis_Club.pdf
          python3 outils/manuels_pdf.py docs/MANUEL_BASIC.md impression/Manuel_MICRO-BASIC.pdf

      - name: Publier dans la release "manuels"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'etiquette "manuels" suit le dernier commit qui a genere les PDF
          git tag -f manuels
          git push -f origin refs/tags/manuels

          {
            echo "Manuels du Minitel Magis Club au format PDF A4, prets a imprimer."
            echo
            echo "- **Manuel_Minitel_Magis_Club.pdf** : guide de l'utilisateur et manuel de reference du systeme"
            echo "- **Manuel_MICRO-BASIC.pdf** : manuel de programmation MICRO-BASIC"
            echo
            echo "Regeneres automatiquement le $(date -u '+%d/%m/%Y a %H:%M UTC'), depuis le commit ${GITHUB_SHA::7}."
          } > notes.md

          if gh release view manuels > /dev/null 2>&1; then
            gh release edit manuels --title "Manuels PDF" --notes-file notes.md --latest
          else
            gh release create manuels --title "Manuels PDF" --notes-file notes.md --latest
          fi
          gh release upload manuels impression/*.pdf --clobber
