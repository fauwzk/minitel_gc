<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 492" width="804" height="492" role="img" aria-label="MICRO-BASIC - RUN, SAVE, LOAD">
<rect x="0" y="0" width="804" height="492" rx="14" fill="rgb(42,45,41)"/>
<rect x="6" y="6" width="792" height="480" rx="10" fill="rgb(18,22,17)"/>
<g font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="16" xml:space="preserve">
<rect x="18.0" y="19.0" width="672.0" height="19.0" fill="rgb(232,240,228)"/>
<text x="27.6" y="33.0" fill="rgb(18,22,17)" textLength="652.8" lengthAdjust="spacingAndGlyphs">MICRO-BASIC TELETEL V6.1 (GPIO/PWM/ADC)   [EXIT] OU [RETOUR] QUITTER</text>
<rect x="18.0" y="38.0" width="768.0" height="19.0" fill="rgb(232,240,228)"/>
<text x="27.6" y="52.0" fill="rgb(18,22,17)" textLength="614.4" lengthAdjust="spacingAndGlyphs">LIGNES:004 | FICHIER:PREMIER | PILOTE:SYSFS | &#x27;HELP&#x27; / &#x27;GPIOMON&#x27;</text>
<text x="18.0" y="71.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">LIGNE NUMERO 1</text>
<text x="18.0" y="90.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">LIGNE NUMERO 2</text>
<text x="18.0" y="109.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">LIGNE NUMERO 3</text>
<text x="18.0" y="128.0" fill="rgb(183,196,177)" textLength="57.6" lengthAdjust="spacingAndGlyphs">READY.</text>
<text x="18.0" y="147.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">&gt; SAVE PREMIER</text>
<text x="18.0" y="166.0" fill="rgb(183,196,177)" textLength="124.8" lengthAdjust="spacingAndGlyphs">SAVED PREMIER</text>
<text x="18.0" y="185.0" fill="rgb(183,196,177)" textLength="48.0" lengthAdjust="spacingAndGlyphs">&gt; NEW</text>
<text x="18.0" y="204.0" fill="rgb(183,196,177)" textLength="57.6" lengthAdjust="spacingAndGlyphs">READY.</text>
<text x="18.0" y="223.0" fill="rgb(183,196,177)" textLength="57.6" lengthAdjust="spacingAndGlyphs">&gt; LIST</text>
<text x="18.0" y="242.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">&gt; LOAD PREMIER</text>
<text x="18.0" y="261.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">LOADED PREMIER</text>
<text x="18.0" y="280.0" fill="rgb(183,196,177)" textLength="57.6" lengthAdjust="spacingAndGlyphs">&gt; LIST</text>
<text x="18.0" y="299.0" fill="rgb(232,240,228)" font-weight="bold" textLength="19.2" lengthAdjust="spacingAndGlyphs">10</text>
<text x="46.8" y="299.0" fill="rgb(183,196,177)" textLength="28.8" lengthAdjust="spacingAndGlyphs">CLS</text>
<text x="18.0" y="318.0" fill="rgb(232,240,228)" font-weight="bold" textLength="19.2" lengthAdjust="spacingAndGlyphs">20</text>
<text x="46.8" y="318.0" fill="rgb(183,196,177)" textLength="134.4" lengthAdjust="spacingAndGlyphs">FOR I = 1 TO 3</text>
<text x="18.0" y="337.0" fill="rgb(232,240,228)" font-weight="bold" textLength="19.2" lengthAdjust="spacingAndGlyphs">30</text>
<text x="46.8" y="337.0" fill="rgb(183,196,177)" textLength="240.0" lengthAdjust="spacingAndGlyphs">PRINT &quot;LIGNE NUMERO &quot; ; I</text>
<text x="18.0" y="356.0" fill="rgb(232,240,228)" font-weight="bold" textLength="19.2" lengthAdjust="spacingAndGlyphs">40</text>
<text x="46.8" y="356.0" fill="rgb(183,196,177)" textLength="57.6" lengthAdjust="spacingAndGlyphs">NEXT I</text>
<text x="18.0" y="375.0" fill="rgb(183,196,177)" textLength="9.6" lengthAdjust="spacingAndGlyphs">&gt;</text>
</g></svg>