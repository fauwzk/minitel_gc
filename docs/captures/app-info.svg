<text x="27.6" y="71.0" fill="rgb(232,240,228)" font-weight="bold" textLength="374.4" lengthAdjust="spacingAndGlyphs">Test du chargeur UGREEN Nexode Pro 300W</text>
<text x="27.6" y="109.0" fill="rgb(183,196,177)" textLength="403.2" lengthAdjust="spacingAndGlyphs">KORBEN  -  22/10 16:44  -  LECTURE : 2 MIN</text>
<text x="27.6" y="128.0" fill="rgb(183,196,177)" textLength="748.8" lengthAdjust="spacingAndGlyphs">------------------------------------------------------------------------------</text>
<text x="37.2" y="147.0" fill="rgb(183,196,177)" textLength="710.4" lengthAdjust="spacingAndGlyphs">et une appli en WiFi permet de suivre tout ca a distance, de regler chaque</text>
<text x="37.2" y="166.0" fill="rgb(183,196,177)" textLength="729.6" lengthAdjust="spacingAndGlyphs">sortie et de choisir entre cinq modes de charge. Gadget ? Peut-etre. Mais je</text>
<text x="37.2" y="185.0" fill="rgb(183,196,177)" textLength="672.0" lengthAdjust="spacingAndGlyphs">passe mon temps a regarder les watts defiler, c&#x27;est plus fort que moi.</text>
<text x="37.2" y="223.0" fill="rgb(183,196,177)" textLength="720.0" lengthAdjust="spacingAndGlyphs">Attention quand meme, il vous faudra aussi lui reserver une vraie place, ce</text>
<text x="37.2" y="242.0" fill="rgb(183,196,177)" textLength="729.6" lengthAdjust="spacingAndGlyphs">n&#x27;est pas un chargeur qu&#x27;on glisse dans un sac, il est fait pour rester pose</text>
<text x="37.2" y="261.0" fill="rgb(183,196,177)" textLength="28.8" lengthAdjust="spacingAndGlyphs">la.</text>
<text x="37.2" y="299.0" fill="rgb(183,196,177)" textLength="585.6" lengthAdjust="spacingAndGlyphs">Niveau prix justement, la station est affichee en ce moment a</text>
<text x="37.2" y="337.0" fill="rgb(183,196,177)" textLength="336.0" lengthAdjust="spacingAndGlyphs">126 euros au lieu de 170 sur Amazon</text>
<text x="37.2" y="375.0" fill="rgb(183,196,177)" textLength="710.4" lengthAdjust="spacingAndGlyphs">, environ un quart de remise, alors qu&#x27;elle etait lancee cet ete autour de</text>
<text x="37.2" y="394.0" fill="rgb(183,196,177)" textLength="691.2" lengthAdjust="spacingAndGlyphs">200 dollars. Du coup, la facture devient nettement plus digeste pour qui</text>
<text x="37.2" y="413.0" fill="rgb(183,196,177)" textLength="384.0" lengthAdjust="spacingAndGlyphs">veut faire le menage dans ses chargeurs.</text>
