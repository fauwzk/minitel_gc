<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 492" width="804" height="492" role="img" aria-label="3615 WIKIPEDIA">
<rect x="0" y="0" width="804" height="492" rx="14" fill="rgb(42,45,41)"/>
<rect x="6" y="6" width="792" height="480" rx="10" fill="rgb(18,22,17)"/>
<g font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="16" xml:space="preserve">
<rect x="18.0" y="19.0" width="768.0" height="19.0" fill="rgb(232,240,228)"/>
<text x="219.6" y="33.0" fill="rgb(18,22,17)" textLength="364.8" lengthAdjust="spacingAndGlyphs">* * *  3615 WIKIPEDIA - MINITEL  * * *</text>
<text x="18.0" y="71.0" fill="rgb(183,196,177)" textLength="768.0" lengthAdjust="spacingAndGlyphs">--------------------------------------------------------------------------------</text>
<text x="27.6" y="90.0" fill="rgb(183,196,177)" textLength="643.2" lengthAdjust="spacingAndGlyphs">Le Minitel (pour &quot; Medium interactif par numerisation d&#x27;information</text>
<text x="27.6" y="109.0" fill="rgb(183,196,177)" textLength="748.8" lengthAdjust="spacingAndGlyphs">telephonique &quot;) est un type de terminal informatique destine a la connexion au</text>
<text x="27.6" y="128.0" fill="rgb(183,196,177)" textLength="700.8" lengthAdjust="spacingAndGlyphs">service francais de Videotex baptise Teletel, commercialement exploite en</text>
<text x="27.6" y="147.0" fill="rgb(183,196,177)" textLength="710.4" lengthAdjust="spacingAndGlyphs">France entre juillet 1980 et le 30 juin 2012. Il est le premier service au</text>
<text x="27.6" y="166.0" fill="rgb(183,196,177)" textLength="748.8" lengthAdjust="spacingAndGlyphs">monde a donner acces a des services varies prefigurant ceux du futur Internet,</text>
<text x="27.6" y="185.0" fill="rgb(183,196,177)" textLength="710.4" lengthAdjust="spacingAndGlyphs">et le plus developpe en 1990. Il utilise pour cela le reseau francais X.25</text>
<text x="27.6" y="204.0" fill="rgb(183,196,177)" textLength="691.2" lengthAdjust="spacingAndGlyphs">Transpac qui lui-meme prefigure la future infrastructure de transmission</text>
<text x="27.6" y="223.0" fill="rgb(183,196,177)" textLength="729.6" lengthAdjust="spacingAndGlyphs">d&#x27;Internet. Il connait un succes considerable et reste longtemps en usage, y</text>
<text x="27.6" y="242.0" fill="rgb(183,196,177)" textLength="326.4" lengthAdjust="spacingAndGlyphs">compris en concurrence d&#x27;Internet.</text>
<text x="27.6" y="261.0" fill="rgb(183,196,177)" textLength="748.8" lengthAdjust="spacingAndGlyphs">Par metonymie, le mot &quot; Minitel &quot; designe aussi l&#x27;ensemble du service Videotex</text>
<text x="27.6" y="280.0" fill="rgb(183,196,177)" textLength="720.0" lengthAdjust="spacingAndGlyphs">en France ainsi que les elements de reseau (Teletel, concentrateurs, points</text>
<text x="27.6" y="299.0" fill="rgb(183,196,177)" textLength="729.6" lengthAdjust="spacingAndGlyphs">d&#x27;acces) destines a rendre ce service, mais ils se terminent reellement dans</text>
<text x="27.6" y="318.0" fill="rgb(183,196,177)" textLength="153.6" lengthAdjust="spacingAndGlyphs">les annees 2000.</text>
<text x="27.6" y="356.0" fill="rgb(232,240,228)" font-weight="bold" textLength="96.0" lengthAdjust="spacingAndGlyphs">HISTORIQUE</text>
<text x="27.6" y="375.0" fill="rgb(183,196,177)" textLength="739.2" lengthAdjust="spacingAndGlyphs">Le Minitel est cree par la Direction generale des Telecommunications (DGT) au</text>
<text x="27.6" y="394.0" fill="rgb(183,196,177)" textLength="748.8" lengthAdjust="spacingAndGlyphs">sein du ministere des Postes et Telecommunications et il est utilise en France</text>
<text x="27.6" y="413.0" fill="rgb(183,196,177)" textLength="307.2" lengthAdjust="spacingAndGlyphs">des annees 1980 aux annees 2000.</text>
<rect x="18.0" y="418.0" width="768.0" height="19.0" fill="rgb(232,240,228)"/>
<text x="27.6" y="432.0" fill="rgb(18,22,17)" textLength="576.0" lengthAdjust="spacingAndGlyphs">PAGE 1 / 47   -   RESUME DE L&#x27;ARTICLE, LA SUITE AVEC [SUITE]</text>
<rect x="18.0" y="456.0" width="768.0" height="19.0" fill="rgb(232,240,228)"/>
<text x="27.6" y="470.0" fill="rgb(18,22,17)" textLength="614.4" lengthAdjust="spacingAndGlyphs">[SUITE] PAGE SUIVANTE  [RETOUR] PRECEDENTE  [SOMMAIRE] RECHERCHE</text>
</g></svg>