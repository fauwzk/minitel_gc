<text x="18.0" y="109.0" fill="rgb(183,196,177)" textLength="384.0" lengthAdjust="spacingAndGlyphs">Veuillez taper ces commandes au clavier:</text>
<text x="18.0" y="147.0" fill="rgb(183,196,177)" textLength="153.6" lengthAdjust="spacingAndGlyphs">1. 80 Colonnes :</text>
