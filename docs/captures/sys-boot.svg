<text x="267.6" y="147.0" fill="rgb(183,196,177)" textLength="38.4" lengthAdjust="spacingAndGlyphs">puis</text>
<text x="315.6" y="147.0" fill="rgb(232,240,228)" font-weight="bold" textLength="9.6" lengthAdjust="spacingAndGlyphs">T</text>
<text x="334.8" y="147.0" fill="rgb(183,196,177)" textLength="38.4" lengthAdjust="spacingAndGlyphs">puis</text>
<text x="382.8" y="147.0" fill="rgb(232,240,228)" font-weight="bold" textLength="9.6" lengthAdjust="spacingAndGlyphs">A</text>
<text x="18.0" y="166.0" fill="rgb(183,196,177)" textLength="153.6" lengthAdjust="spacingAndGlyphs">2. Echo OFF    :</text>
<text x="181.2" y="166.0" fill="rgb(232,240,228)" font-weight="bold" textLength="76.8" lengthAdjust="spacingAndGlyphs">Ctrl+Esc</text>
<text x="267.6" y="166.0" fill="rgb(183,196,177)" textLength="38.4" lengthAdjust="spacingAndGlyphs">puis</text>
<text x="315.6" y="166.0" fill="rgb(232,240,228)" font-weight="bold" textLength="9.6" lengthAdjust="spacingAndGlyphs">T</text>
<text x="334.8" y="166.0" fill="rgb(183,196,177)" textLength="38.4" lengthAdjust="spacingAndGlyphs">puis</text>
<text x="382.8" y="166.0" fill="rgb(232,240,228)" font-weight="bold" textLength="9.6" lengthAdjust="spacingAndGlyphs">E</text>
<text x="18.0" y="185.0" fill="rgb(183,196,177)" textLength="153.6" lengthAdjust="spacingAndGlyphs">3. Clav. Etendu:</text>
