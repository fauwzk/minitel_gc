<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 492" width="804" height="492" role="img" aria-label="MICRO-BASIC - aide en ligne">
<rect x="0" y="0" width="804" height="492" rx="14" fill="rgb(42,45,41)"/>
<rect x="6" y="6" width="792" height="480" rx="10" fill="rgb(18,22,17)"/>
<g font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="16" xml:space="preserve">
<rect x="18.0" y="19.0" width="710.4" height="19.0" fill="rgb(232,240,228)"/>
<text x="27.6" y="33.0" fill="rgb(18,22,17)" textLength="700.8" lengthAdjust="spacingAndGlyphs">MICRO-BASIC V6.0 : MANUEL COMPLET   [Z/S/FLECHES] DEFILER [RETOUR] FERMER</text>
<text x="37.2" y="71.0" fill="rgb(232,240,228)" font-weight="bold" textLength="374.4" lengthAdjust="spacingAndGlyphs">=== 1. COMMANDES DU SHELL =============</text>
<text x="37.2" y="90.0" fill="rgb(183,196,177)" textLength="691.2" lengthAdjust="spacingAndGlyphs">RUN        : Execute le programme   NEW / CLEAR: Efface code + coupe PWM</text>
<text x="37.2" y="109.0" fill="rgb(183,196,177)" textLength="691.2" lengthAdjust="spacingAndGlyphs">LIST       : Affiche le code        DIR        : Liste les fichiers .bas</text>
<text x="37.2" y="128.0" fill="rgb(183,196,177)" textLength="662.4" lengthAdjust="spacingAndGlyphs">EDIT X     : Edite la ligne X       SAVE NOM   : Sauvegarde (sans &quot;&quot;)</text>
<text x="37.2" y="147.0" fill="rgb(183,196,177)" textLength="652.8" lengthAdjust="spacingAndGlyphs">STOP / END : Arrete l&#x27;execution     LOAD NOM   : Charge un programme</text>
<text x="37.2" y="166.0" fill="rgb(183,196,177)" textLength="662.4" lengthAdjust="spacingAndGlyphs">GPIOMON    : Moniteur visuel temps reel (GPIO, PWM % et Canaux ADC) !</text>
<text x="37.2" y="204.0" fill="rgb(232,240,228)" font-weight="bold" textLength="374.4" lengthAdjust="spacingAndGlyphs">=== 2. GPIO NUMERIQUE (BROCHES BCM) ===</text>
<text x="37.2" y="223.0" fill="rgb(183,196,177)" textLength="662.4" lengthAdjust="spacingAndGlyphs">PINMODE P M: Mode de la broche P -&gt; OUT (Sortie), IN, PU (PullUp), PD</text>
<text x="162.0" y="242.0" fill="rgb(183,196,177)" textLength="374.4" lengthAdjust="spacingAndGlyphs">Ex: PINMODE 17 OUT   ou   PINMODE 27 PU</text>
<text x="37.2" y="261.0" fill="rgb(183,196,177)" textLength="643.2" lengthAdjust="spacingAndGlyphs">OUT P V    : Met la broche P a 1 (3.3V) ou 0 (GND). Alias: POKE P V</text>
<text x="162.0" y="280.0" fill="rgb(183,196,177)" textLength="441.6" lengthAdjust="spacingAndGlyphs">Ex: OUT 17 1   (Allume LED/Relais sur GPIO 17)</text>
<text x="37.2" y="299.0" fill="rgb(183,196,177)" textLength="672.0" lengthAdjust="spacingAndGlyphs">TOGGLE P   : Inverse l&#x27;etat logique 0/1 de la broche P (Ex: TOGGLE 17)</text>
<text x="37.2" y="318.0" fill="rgb(183,196,177)" textLength="720.0" lengthAdjust="spacingAndGlyphs">PULSE P D  : Impulsion a 1 sur la broche P pendant D sec (Ex: PULSE 17 0.5)</text>
<text x="37.2" y="337.0" fill="rgb(183,196,177)" textLength="691.2" lengthAdjust="spacingAndGlyphs">IN P       : Lit l&#x27;etat (0 ou 1) de la broche P (Aussi: IN(P) ou PEEK P)</text>
<text x="162.0" y="356.0" fill="rgb(183,196,177)" textLength="422.4" lengthAdjust="spacingAndGlyphs">Ex: IF IN 27 EQ 0 THEN PRINT &quot;BOUTON PRESSE&quot;</text>
<text x="37.2" y="394.0" fill="rgb(232,240,228)" font-weight="bold" textLength="374.4" lengthAdjust="spacingAndGlyphs">=== 3. PWM, FREQUENCE &amp; ANALOGIQUE ====</text>
<text x="37.2" y="413.0" fill="rgb(183,196,177)" textLength="691.2" lengthAdjust="spacingAndGlyphs">PWM P R    : Signal PWM sur broche P avec rapport cyclique R (0 a 100 %)</text>
<text x="162.0" y="432.0" fill="rgb(183,196,177)" textLength="576.0" lengthAdjust="spacingAndGlyphs">Ex: PWM 18 75  (Module la broche 18 a 75%) | PWM 18 0 (Stop)</text>
<rect x="18.0" y="456.0" width="672.0" height="19.0" fill="rgb(232,240,228)"/>
<text x="27.6" y="470.0" fill="rgb(18,22,17)" textLength="652.8" lengthAdjust="spacingAndGlyphs">LIGNE 01/20 - UTILISEZ LES FLECHES HAUT/BAS OU [RETOUR] POUR QUITTER</text>
</g></svg>